name: Transcrire une chanson (mots minutés)
on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Dossier du projet (ex : projets/clip-avance)"
        required: true
      fichier:
        description: "Fichier audio dans ce dossier"
        required: true
permissions:
  contents: write
jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer la transcription
        run: pip install faster-whisper==1.1.1
      - name: Transcrire (mots + temps)
        env:
          DOSSIER: ${{ inputs.dossier }}
          FICHIER: ${{ inputs.fichier }}
        run: |
          python - <<'PY'
          import json, os
          from faster_whisper import WhisperModel
          d=os.environ["DOSSIER"]; f=os.path.join(d,os.environ["FICHIER"])
          invite=open(os.path.join(d,"paroles.txt"),encoding="utf-8").read() if os.path.exists(os.path.join(d,"paroles.txt")) else None
          m=WhisperModel("large-v3", device="cpu", compute_type="int8")
          segs,info=m.transcribe(f, language="fr", word_timestamps=True, vad_filter=False, initial_prompt=invite, beam_size=5, condition_on_previous_text=False)
          out=[]
          for s in segs:
              out.append({"debut":round(s.start,3),"fin":round(s.end,3),"texte":s.text.strip(),
                          "mots":[{"mot":w.word.strip(),"debut":round(w.start,3),"fin":round(w.end,3),"proba":round(w.probability,3)} for w in (s.words or [])]})
              print(f"{s.start:7.2f}-{s.end:7.2f} {s.text.strip()}")
          json.dump(out,open(os.path.join(d,"transcription.json"),"w",encoding="utf-8"),ensure_ascii=False,indent=1)
          PY
      - name: Enregistrer le résultat
        run: |
          git config user.name "transcription"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.dossier }}/transcription.json"
          git commit -m "Transcription de ${{ inputs.fichier }}" && git push
